<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple Background</title>
    <style>
        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #69008f;
        }

        .frame {
            width: 400px;
            height: 400px;
            border: 10px solid white;
            margin: auto;
            background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT6rH65hMJ6X97aBo5PVTSixLX78Wy2Lr_SYI5QG_5k3A&s=10), url(img/bg-remove.png), url(img/file-svg.png);
            background-size: 320px, 400px, 700px;
            background-repeat: no-repeat, no-repeat, no-repeat;
            background-position: center bottom, center, top;
            background-color: #f0f0f0;
            border-radius: 50%;
        }

        h1 {
            color: white;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            font-size: 40px;
            text-shadow: 2px 2px 4px black;
        }
    </style>
</head>
<body>
    <h1>My Profile Card</h1>
    <div class="frame"></div>
</body>
</html>
