<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coba Box Model</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .kotak1 {
      width: 300px;
      height: 300px;
      background-color: rgb(146, 255, 134);
      margin: 10px 20px 30px 40px;
      padding: 50px;
      border: 10px solid rgb(0, 0, 0);
    }

    .kotak2 {
      width: 200px;
      height: 200px;
      background-color: rgb(0, 247, 231);
      margin-top: -50px;
    border: 10px solid rgb(255, 0, 0);
    }
  </style>
</head>

<body>
  <div class="kotak1">1</div>
  <div class="kotak2">2</div>
</body>

</html>
